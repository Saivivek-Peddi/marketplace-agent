name: pizza
on:
  push:
    branches: ["claude/new-session-meg81h"]

jobs:
  order:
    if: contains(github.event.head_commit.message, '[pizza')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debug probe
        if: contains(github.event.head_commit.message, '[pizza-debug]')
        run: python3 -m pizza_agent.debug_probe
      - name: Recon
        if: contains(github.event.head_commit.message, '[pizza-recon]')
        run: python3 -m pizza_agent.recon
      - name: Browser probe
        if: contains(github.event.head_commit.message, '[pizza-browser]')
        run: |
          pip install playwright
          python3 -m playwright install chromium
          python3 -m pizza_agent.${PROBE:-browser_probe}
        env:
          PROBE: ${{ contains(github.event.head_commit.message, '[probe2]') && 'browser_probe2' || 'browser_probe' }}
      - name: Upload screenshots
        if: contains(github.event.head_commit.message, '[pizza-browser]')
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: shots/
      - name: Dry run (price only)
        if: contains(github.event.head_commit.message, '[pizza-dry]')
        run: python3 -m pizza_agent.order_now --name "Sai Vivek Peddi" --phone "5302207864" --dry-run
      - name: Place order for real
        if: contains(github.event.head_commit.message, '[pizza-order]')
        run: python3 -m pizza_agent.order_now --name "Sai Vivek Peddi" --phone "5302207864" --yes
